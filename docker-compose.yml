services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_DB: trackit, POSTGRES_USER: trackit, POSTGRES_PASSWORD: trackit }
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  app:
    build: .
    profiles: ["full"]          # docker compose --profile full up --build
    depends_on: [postgres, redis]
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/trackit
      SPRING_DATA_REDIS_HOST: redis
